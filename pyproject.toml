[project]
name = "tothcode"
version = "0.1.0"
description = "CLI coding agent harness with Docker sandbox"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "docker>=7.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
tothcode = "harness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
